<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جدول مباريات اليوم - لوحة التحكم</title>
  
  <meta name="description" content="لوحة تحكم لإنشاء وتصميم جدول مباريات اليوم للدوريات العالمية والعربية.">
  <meta property="og:title" content="صانع جدول مباريات" />
  <meta property="og:description" content="لوحة تحكم من خلالها تنشئ جدول مباريات للدوريات العالمية والعربية مدعومة من يمن ستلايت" />
  <meta property="og:image" content="https://raw.githubusercontent.com/falahsab/jedwal/refs/heads/main/img/yemen-sat.png" />
  <meta property="og:url" content="https://jedwal.yemensat.com/" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="img/jedwal000.png">

  <!-- Google Fonts: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS Libraries -->
  <link rel="stylesheet" href="css/select2.min.css">

  <!-- JS Libraries -->
  <script src="js/jquery.min.js"></script>
  <script src="js/select2.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js"></script>
  <script src="js/papaparse.min.js"></script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070607">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    body {
      background: #121212;
      margin: 0;
      padding: 0;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* الهيدر العلوي للموقع */
    .site-header {
      background: #080808;
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 950px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #1f1f1f;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #333;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    select, input[type="time"], input[type="date"] {
      background: #2b2b2b;
      border: 1px solid #444;
      padding: 9px 12px;
      border-radius: 8px;
      color: #ffffff;
      width: 100%;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: #3498db;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      display: block;
      margin-bottom: 6px;
    }

    .logo-preview {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #2a2a2a;
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .btn {
      background: #3498db;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-purple { background: #6c5ce7; }
    .btn-danger { background: #e74c3c; }
    .btn-secondary { background: #3a3a3a; }
    .btn-success { background: #27ae60; }

    /* =======================================
       🎨 نظام الثيمات المتقدم لمنطقة الصورة
       ======================================= */
    #exportArea {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    /* 1. ثيم كلاسيكي داكن (Dark Obsidian) */
    #exportArea.theme-dark {
      --bg-main: #141414;
      --card-bg: #1c1c1c;
      --accent: #3498db;
      --border-color: rgba(255, 255, 255, 0.08);
      --header-grad: linear-gradient(135deg, #1b2636, #0e1217);
      --time-color: #f1c40f;
    }

    /* 2. ثيم كحلي ملكي (Royal Navy) */
    #exportArea.theme-navy {
      --bg-main: #0a111a;
      --card-bg: #101c2b;
      --accent: #00d2d3;
      --border-color: rgba(0, 210, 211, 0.18);
      --header-grad: linear-gradient(135deg, #0e2947, #07101a);
      --time-color: #f6b93b;
    }

    /* 3. ثيم الزمرد الرياضي (Stadium Emerald) */
    #exportArea.theme-emerald {
      --bg-main: #081711;
      --card-bg: #0f271d;
      --accent: #2ecc71;
      --border-color: rgba(46, 204, 113, 0.18);
      --header-grad: linear-gradient(135deg, #0f3d28, #07140e);
      --time-color: #f1c40f;
    }

    /* 4. ثيم الياقوت الناري (Crimson Fire) */
    #exportArea.theme-crimson {
      --bg-main: #18090b;
      --card-bg: #270f14;
      --accent: #ff4757;
      --border-color: rgba(255, 71, 87, 0.2);
      --header-grad: linear-gradient(135deg, #440d16, #150608);
      --time-color: #ffa502;
    }

    /* 5. ثيم بنفسجي نيون (Cyber Violet) */
    #exportArea.theme-violet {
      --bg-main: #0f0b1a;
      --card-bg: #1a132e;
      --accent: #a29bfe;
      --border-color: rgba(162, 155, 254, 0.22);
      --header-grad: linear-gradient(135deg, #2e1a5a, #0c0817);
      --time-color: #fdcb6e;
    }

    /* 6. ثيم أسود وذهبي فاخر (Luxury Gold) */
    #exportArea.theme-gold {
      --bg-main: #121212;
      --card-bg: #1b1915;
      --accent: #d4af37;
      --border-color: rgba(212, 175, 55, 0.25);
      --header-grad: linear-gradient(135deg, #33270d, #111111);
      --time-color: #f9ca24;
    }

    #exportArea {
      background-color: var(--bg-main) !important;
      border: 1px solid var(--border-color) !important;
    }

    /* =======================================
       ✨ تصميم الهيدر الجمالي داخل الصورة المصدرة
       ======================================= */
    .poster-header {
      background: var(--header-grad);
      padding: 16px 14px 14px;
      text-align: center;
      position: relative;
      border-bottom: 2px solid var(--accent);
    }

    .poster-header::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--accent);
      filter: blur(4px);
      opacity: 0.8;
    }

    .poster-badge {
      display: inline-block;
      padding: 3px 12px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--accent);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .poster-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .poster-date {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 4px;
    }

    /* محتوى البطاقات */
    .poster-body {
      padding: 14px;
    }

    .matches-section {
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      border-right: 4px solid var(--accent);
      position: relative;
    }

    .extra-logo-header {
      margin-right: auto;
      height: 22px;
      object-fit: contain;
    }

    .match-card {
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      position: relative;
      overflow: hidden;
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border-color);
    }

    .match_row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .team.hometeam { justify-content: flex-end; text-align: left; }
    .team.awayteam { justify-content: flex-start; text-align: right; }

    .team_logo {
      width: clamp(28px, 4vw, 38px);
      height: clamp(28px, 4vw, 38px);
      object-fit: contain;
      flex-shrink: 0;
    }

    .the_team {
      font-weight: 700;
      font-size: clamp(11px, 1.7vw, 14px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      flex: 1;
    }

    /* 👈 وضع التصدير: استيعاب أطول أسماء الفرق بدون قص */
    #exportArea.export-mode {
      width: 520px !important;
      max-width: 520px !important;
    }

    #exportArea.export-mode .the_team {
      max-width: none !important;
      width: auto !important;
      overflow: visible !important;
      text-overflow: clip !important;
      white-space: nowrap !important;
      font-size: 13.5px !important;
    }

    .middle_column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: clamp(14px, 2.2vw, 18px);
      min-width: 75px;
    }

    .the_time {
      display: flex;
      align-items: center;
      gap: 4px;
      direction: ltr;
      color: var(--time-color);
    }

    .next-day-label {
      font-size: 9px;
      color: #ff7675;
      margin-top: 2px;
      font-weight: bold;
    }

    .meta {
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed rgba(255,255,255,0.06);
    }

    .action-btns {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      justify-content: center;
    }

    .action-btns button {
      padding: 4px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .poster-footer {
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: #aaa;
      border-top: 1px solid var(--border-color);
      background: rgba(0,0,0,0.2);
    }

    /* Select2 Customization */
    .select2-container--default .select2-selection--single {
      background-color: #2b2b2b !important;
      border: 1px solid #444 !important;
      border-radius: 8px !important;
      height: 40px !important;
      display: flex;
      align-items: center;
    }

    .select2-container--default .select2-selection--single .select2-selection__rendered {
      color: #ffffff !important;
      line-height: 38px !important;
      padding-right: 10px !important;
    }

    .select2-dropdown {
      background-color: #252525 !important;
      border: 1px solid #444 !important;
      color: #fff !important;
    }

    .select2-container--default .select2-results__option--highlighted {
      background-color: #3498db !important;
    }

    .select2-container--default .select2-search--dropdown .select2-search__field {
      background-color: #333 !important;
      color: #fff !important;
      border: 1px solid #555 !important;
      border-radius: 6px;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash img {
      width: 100px;
      height: 100px;
      border-radius: 20px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- شاشة البداية -->
  <div id="splash">
    <img src="img/jedwal000.png" alt="شعار التطبيق" onerror="this.style.display='none'">
    <h2 style="margin-top:16px;">⚽ صانع جدول المباريات</h2>
    <p style="color:#aaa; font-size:13px; position:absolute; bottom:20px;">www.yemensat.com</p>
  </div>

  <!-- الهيدر الثابت للموقع -->
  <header class="site-header">
    <div>⚽ لوحة تحكم جدول المباريات</div>
    <div style="font-size:14px; font-weight:400; color:#3498db;" id="siteHeaderDate"></div>
  </header>

  <div class="container" id="mainContent">
    <div class="grid">
      
      <!-- نموذج إدخال المباراة والتحكم -->
      <div class="card form">
        <h3 style="margin-top:0; margin-bottom:14px; font-size:16px; border-bottom:1px solid #333; padding-bottom:8px;">
          📝 بيانات المباراة
        </h3>

        <!-- اختيار الثيم المفضل -->
        <div class="row">
          <div style="flex:1;">
            <label for="themeSelect">🎨 ثيم الجدول (اختر مظهر التصميم)</label>
            <select id="themeSelect">
              <option value="theme-dark">🖤 كلاسيكي داكن (Dark Obsidian)</option>
              <option value="theme-navy">🔷 كحلي ملكي (Royal Navy)</option>
              <option value="theme-emerald">🟢 زمردي رياضي (Stadium Emerald)</option>
              <option value="theme-crimson">🔴 ياقوتي ناري (Crimson Fire)</option>
              <option value="theme-violet">🟣 بنفسجي نيون (Cyber Violet)</option>
              <option value="theme-gold">👑 ذهبي فاخر (Luxury Gold)</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div style="flex:1;">
            <label for="leagueSelect">الدوري</label>
            <select id="leagueSelect"></select>
          </div>
          <div style="width:130px;">
            <label for="matchTime">الوقت</label>
            <input id="matchTime" type="time" />
          </div>
        </div>

        <div class="row">
          <div style="flex:1;">
            <label for="homeTeam">الفريق المضيف</label>
            <select id="homeTeam"></select>
          </div>
          <div style="width:42px;">
            <label>&nbsp;</label>
            <div class="logo-preview" id="homePreview">🏠</div>
          </div>
        </div>

        <div class="row">
          <div style="flex:1;">
            <label for="awayTeam">الفريق الضيف</label>
            <select id="awayTeam"></select>
          </div>
          <div style="width:42px;">
            <label>&nbsp;</label>
            <div class="logo-preview" id="awayPreview">⚽</div>
          </div>
        </div>

        <div class="row">
          <div style="flex:1;">
            <label for="commentator">المعلق</label>
            <select id="commentator"></select>
          </div>
          <div style="flex:1;">
            <label for="channel">القناة الناقلة</label>
            <select id="channel"></select>
          </div>
        </div>

        <!-- أزرار الإضافة والتحكم -->
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button id="addMatch" class="btn" style="flex:2;">➕ إضافة المباراة</button>
          <button id="cancelEditBtn" class="btn btn-secondary" style="flex:1; display:none;">❌ إلغاء</button>
          <button id="nextDayBtn" class="btn btn-purple" style="flex:1.5;">📅 الغد: <span id="nextDayState">❌</span></button>
        </div>

        <div style="display:flex; gap:8px; margin-top:8px;">
          <button id="toggleBtns" class="btn btn-secondary" style="flex:1;">👁️ إخفاء/إظهار الإجراءات</button>
          <button id="deleteAll" class="btn btn-danger" style="flex:1;">🗑️ تفريغ الجدول</button>
        </div>

        <hr style="border:0; border-top:1px solid #333; margin:16px 0;">

        <div class="row">
          <div style="flex:1;">
            <label for="extraLogoSelect">الشعار الجانبي (Extra Logo)</label>
            <select id="extraLogoSelect"></select>
          </div>
          <div style="width:42px;">
            <label>&nbsp;</label>
            <div class="logo-preview" id="extraPreview">🖼️</div>
          </div>
        </div>

        <div class="row" style="margin-bottom:0;">
          <div style="flex:1;">
            <input type="date" id="manualDate" style="display:none; margin-bottom:8px;">
            <button id="editDateBtn" class="btn btn-secondary" style="width:100%;">📅 تخصيص التاريخ</button>
          </div>
        </div>
      </div>

      <!-- عرض الجدول ومعاينة التصدير -->
      <div>
        <div class="matches-wrapper">
          <div id="exportArea" class="theme-dark">
            
            <!-- ✨ الهيدر الجمالي الذي سيظهر داخل الصورة الملتقطة ✨ -->
            <div class="poster-header">
              <span class="poster-badge"><h6 class="poster-title">⚽ أهم مباريات اليوم</h6></span>
              <div class="poster-date" id="posterDateDisplay"></div>
            </div>

            <!-- محتوى البطاقات -->
            <div class="poster-body">
              <div id="matchesContainer"></div>
            </div>
            
            <!-- تذييل الصورة -->
            <div class="poster-footer">
              مع VIP عيش المتعة .. اشترك الآن | عبر الواتساب: <strong style="color:#2ecc71;">738092209</strong>
            </div>
          </div>
        </div>

        <!-- أزرار الإخراج -->
        <div style="display:flex; gap:8px;">
          <button id="downloadTable" class="btn btn-success" style="flex:2;">📸 تحميل كصورة (Full HD)</button>
          <button id="swapSections" class="btn btn-secondary" style="flex:1;">تبديل الموضع ↔️</button>
        </div>
      </div>

    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {

    // === إدارة التاريخ واليوم ===
    const siteHeaderDate = document.getElementById('siteHeaderDate');
    const posterDateDisplay = document.getElementById('posterDateDisplay');
    const manualDateEl = document.getElementById('manualDate');
    const editBtn = document.getElementById('editDateBtn');
    const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    let currentDate = new Date();
    function updateDateDisplay(date) {
      const formatted = `${days[date.getDay()]} ${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
      siteHeaderDate.textContent = formatted;
      posterDateDisplay.textContent = `📅 ${formatted}`;
    }
    updateDateDisplay(currentDate);

    editBtn.addEventListener('click', () => {
      manualDateEl.style.display = manualDateEl.style.display === 'none' ? 'block' : 'none';
      if (manualDateEl.style.display === 'block') {
        manualDateEl.valueAsDate = currentDate;
      }
    });

    manualDateEl.addEventListener('change', () => {
      const selected = new Date(manualDateEl.value);
      if (!isNaN(selected)) {
        currentDate = selected;
        updateDateDisplay(currentDate);
      }
    });

    // === إدارة الثيمات ===
    const themeSelect = document.getElementById('themeSelect');
    const exportArea = document.getElementById('exportArea');

    // استعادة الثيم المحفوظ
    const savedTheme = localStorage.getItem('selectedTheme') || 'theme-dark';
    themeSelect.value = savedTheme;
    exportArea.className = savedTheme;

    themeSelect.addEventListener('change', (e) => {
      const theme = e.target.value;
      exportArea.className = theme;
      localStorage.setItem('selectedTheme', theme);
    });

    // === مسارات الملفات والمتغيرات العامة ===
    const leaguesCSV = 'csv/leagues.csv';
    const commentatorsCSV = 'csv/commentators.csv';
    const channelsCSV = 'csv/channels.csv';
    const teamsCSVFolder = 'teams/';
    const extraLogosCSV = 'csv/extra_logos.csv';

    let leagues = [], teams = {}, commentators = [], channels = [], extraLogos = [];
    let selectedExtraLogo = "";
    let matches = JSON.parse(localStorage.getItem('matches') || '[]');
    let editMatchId = null;
    let isNextDay = false;
    let showBtns = true;

    // جلب ملفات CSV
    function loadCSV(url) {
      return new Promise((resolve) => {
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: (res) => resolve(res.data || []),
          error: () => resolve([])
        });
      });
    }

    // تحويل الصور إلى Base64
    function toBase64(url) {
      return new Promise((resolve) => {
        if (!url || url.startsWith('data:')) {
          resolve(url || '');
          return;
        }
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          } catch (e) {
            resolve(url);
          }
        };
        img.onerror = () => resolve(url);
        img.src = url;
      });
    }

    // تحديث المعاينة للشعارات
    function updatePreview(selectEl, previewId, fallbackIcon) {
      if (!selectEl || !selectEl.selectedOptions || selectEl.selectedOptions.length === 0) {
        document.getElementById(previewId).innerHTML = fallbackIcon;
        return;
      }
      const img = selectEl.selectedOptions[0]?.dataset?.img;
      if (img) {
        document.getElementById(previewId).innerHTML = `<img src="${img}" alt="preview">`;
      } else {
        document.getElementById(previewId).innerHTML = fallbackIcon;
      }
    }

    // تحميل فرق الدوري المحدد
    async function loadTeams(leagueCode) {
      if (!teams[leagueCode]) {
        teams[leagueCode] = await loadCSV(`${teamsCSVFolder}${leagueCode}_teams.csv`);
      }
      const teamList = teams[leagueCode] || [];
      const homeTeam = document.getElementById('homeTeam');
      const awayTeam = document.getElementById('awayTeam');

      const optionsHtml = teamList.map(t => `<option value="${t.name}" data-img="${t.img || ''}">${t.name}</option>`).join('');
      homeTeam.innerHTML = optionsHtml;
      awayTeam.innerHTML = optionsHtml;

      $('#homeTeam').val($('#homeTeam option:first').val()).trigger('change');
      $('#awayTeam').val($('#awayTeam option:eq(1)').val() || $('#awayTeam option:first').val()).trigger('change');

      updatePreview(homeTeam, 'homePreview', '🏠');
      updatePreview(awayTeam, 'awayPreview', '⚽');
    }

    // تهيئة البيانات
    async function init() {
      $('#leagueSelect, #homeTeam, #awayTeam, #commentator, #channel, #extraLogoSelect').select2({
        width: '100%',
        dir: 'rtl',
        language: { noResults: () => "لا توجد نتائج مطابقة" }
      });

      const [leaguesData, commsData, chansData, extrasData] = await Promise.all([
        loadCSV(leaguesCSV),
        loadCSV(commentatorsCSV),
        loadCSV(channelsCSV),
        loadCSV(extraLogosCSV)
      ]);

      leagues = leaguesData;
      commentators = commsData;
      channels = chansData;
      extraLogos = extrasData;

      // تعبئة الدوريات
      const leagueSelect = document.getElementById('leagueSelect');
      leagueSelect.innerHTML = leagues.map(l => 
        `<option value="${l.code}" data-logo="${l.logo || ''}" data-color="${l.color || ''}" data-extra="${l.extraLogo || ''}">${l.name}</option>`
      ).join('');

      // تعبئة المعلقين
      document.getElementById('commentator').innerHTML = commentators.map(c => `<option value="${c.name}">${c.name}</option>`).join('');

      // تعبئة القنوات
      document.getElementById('channel').innerHTML = channels.map(c => `<option value="${c.name}" data-logo="${c.logo || ''}">${c.name}</option>`).join('');

      // تعبئة الشعار الإضافي
      const extraSelect = document.getElementById('extraLogoSelect');
      extraSelect.innerHTML = extraLogos.map(x => `<option value="${x.logo}">${x.name}</option>`).join('');
      if (extraLogos.length > 0) {
        selectedExtraLogo = extraLogos[0].logo;
        document.getElementById('extraPreview').innerHTML = `<img src="${selectedExtraLogo}" alt="Extra">`;
      }

      $('#leagueSelect').on('select2:select', function () {
        loadTeams(this.value);
      });

      $('#homeTeam').on('change', function() { updatePreview(this, 'homePreview', '🏠'); });
      $('#awayTeam').on('change', function() { updatePreview(this, 'awayPreview', '⚽'); });

      $('#extraLogoSelect').on('change', function() {
        selectedExtraLogo = this.value;
        document.getElementById('extraPreview').innerHTML = `<img src="${selectedExtraLogo}" alt="Extra">`;
        render();
      });

      if (leagues.length > 0) {
        await loadTeams(leagues[0].code);
      }

      render();
    }

    // زر اليوم التالي
    document.getElementById('nextDayBtn').onclick = () => {
      isNextDay = !isNextDay;
      document.getElementById('nextDayState').textContent = isNextDay ? '✅' : '❌';
    };

    // إضافة أو حفظ تعديل مباراة
    document.getElementById('addMatch').onclick = async () => {
      const league = document.getElementById('leagueSelect').value;
      const home = document.getElementById('homeTeam').value;
      const away = document.getElementById('awayTeam').value;
      const time = document.getElementById('matchTime').value;
      const comm = document.getElementById('commentator').value;
      const chan = document.getElementById('channel').value;

      if (!time) {
        alert('⚠️ يرجى تحديد وقت المباراة أولاً');
        return;
      }

      if (home === away) {
        alert('⚠️ لا يمكن اختيار نفس الفريق كمضيف وضيف!');
        return;
      }

      const homeImgRaw = document.getElementById('homeTeam').selectedOptions[0]?.dataset?.img || '';
      const awayImgRaw = document.getElementById('awayTeam').selectedOptions[0]?.dataset?.img || '';
      const chanLogoRaw = channels.find(c => c.name === chan)?.logo || '';

      const [homeImg, awayImg, chanLogo] = await Promise.all([
        toBase64(homeImgRaw),
        toBase64(awayImgRaw),
        toBase64(chanLogoRaw)
      ]);

      if (editMatchId) {
        const idx = matches.findIndex(m => m.id === editMatchId);
        if (idx !== -1) {
          matches[idx] = { ...matches[idx], league, home, away, time, comm, chan, homeImg, awayImg, chanLogo, nextDay: isNextDay };
        }
        resetEditMode();
      } else {
        const newMatch = {
          id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          league, home, away, time, comm, chan,
          homeImg, awayImg, chanLogo,
          nextDay: isNextDay
        };
        matches.push(newMatch);
      }

      localStorage.setItem('matches', JSON.stringify(matches));
      render();

      document.getElementById('matchTime').value = '';
      isNextDay = false;
      document.getElementById('nextDayState').textContent = '❌';
    };

    // وضع التعديل
    window.editMatch = async (id) => {
      const match = matches.find(m => m.id === id);
      if (!match) return;

      editMatchId = id;
      document.getElementById('addMatch').textContent = '💾 حفظ التعديل';
      document.getElementById('addMatch').classList.add('btn-success');
      document.getElementById('cancelEditBtn').style.display = 'inline-flex';

      $('#leagueSelect').val(match.league).trigger('change');
      await loadTeams(match.league);

      $('#homeTeam').val(match.home).trigger('change');
      $('#awayTeam').val(match.away).trigger('change');
      $('#commentator').val(match.comm).trigger('change');
      $('#channel').val(match.chan).trigger('change');

      document.getElementById('matchTime').value = match.time;
      isNextDay = !!match.nextDay;
      document.getElementById('nextDayState').textContent = isNextDay ? '✅' : '❌';
    };

    function resetEditMode() {
      editMatchId = null;
      document.getElementById('addMatch').textContent = '➕ إضافة المباراة';
      document.getElementById('addMatch').classList.remove('btn-success');
      document.getElementById('cancelEditBtn').style.display = 'none';
      document.getElementById('matchTime').value = '';
    }

    document.getElementById('cancelEditBtn').onclick = resetEditMode;

    // حذف مباراة
    window.deleteMatch = (id) => {
      if (confirm('هل أنت متأكد من حذف هذه المباراة؟')) {
        matches = matches.filter(m => m.id !== id);
        localStorage.setItem('matches', JSON.stringify(matches));
        if (editMatchId === id) resetEditMode();
        render();
      }
    };

    // تفريغ الجدول
    document.getElementById('deleteAll').onclick = () => {
      if (matches.length === 0) return;
      if (confirm('⚠️ هل تريد حذف جميع المباريات الموجودة في الجدول؟')) {
        matches = [];
        localStorage.setItem('matches', '[]');
        resetEditMode();
        render();
      }
    };

    // إخفاء/إظهار الإجراءات
    document.getElementById('toggleBtns').onclick = () => {
      showBtns = !showBtns;
      render();
    };

    // تبديل ترتيب القسمين
    document.getElementById('swapSections').onclick = () => {
      const grid = document.querySelector('.grid');
      grid.appendChild(grid.firstElementChild);
    };

    // توليد وعرض بطاقات المباريات
    function render() {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '';

      if (matches.length === 0) {
        container.innerHTML = '<div class="empty-state">لا توجد مباريات مضافة حالياً.<br>أضف مبارياتك اليوم من النموذج وستظهر هنا فوراً!</div>';
        return;
      }

      leagues.forEach(l => {
        const leagueMatches = matches.filter(m => m.league === l.code);
        if (leagueMatches.length === 0) return;

        const section = document.createElement('div');
        section.className = 'matches-section';

        const header = document.createElement('div');
        header.className = 'section-header';
        
        const extraLogo = selectedExtraLogo || l.extraLogo || '';
        header.innerHTML = `
          <img src="${l.logo || ''}" style="width:22px;height:22px;object-fit:contain;" alt="">
          <span>${l.name}</span>
          ${extraLogo ? `<img src="${extraLogo}" class="extra-logo-header" alt="">` : ''}
        `;
        section.appendChild(header);

        leagueMatches.forEach(m => {
          const card = document.createElement('div');
          card.className = 'match-card';
          
          if (l.color && l.color !== '#fdfdfd') {
            card.style.backgroundColor = l.color;
          }

          const [hours, minutes] = (m.time || "00:00").split(':');
          let displayHours = parseInt(hours, 10);
          const ampm = displayHours >= 12 ? 'م' : 'ص';
          displayHours = displayHours % 12 || 12;

          let bottomHTML = '';
          if (m.comm || m.chanLogo) {
            bottomHTML = `
              <div class="meta">
                ${m.chanLogo ? `<img src="${m.chanLogo}" style="position:absolute; left:4px; height:24px; object-fit:contain;" alt="${m.chan}">` : ''}
                ${m.comm ? `<div style="flex:1; text-align:center; font-size:12px; color:#ddd;">🎙️ ${m.comm}</div>` : ''}
              </div>
            `;
          }

          card.innerHTML = `
            <div class="match_row">
              <div class="team hometeam">
                <span class="the_team" title="${m.home}">${m.home}</span>
                <img src="${m.homeImg}" class="team_logo" alt="${m.home}">
              </div>
              
              <div class="middle_column">
                <div class="the_time">
                  <span>${displayHours}:${minutes}</span>
                  <span style="font-size:11px; margin-right:2px;">${ampm}</span>
                </div>
                ${m.nextDay ? "<span class='next-day-label'>(اليوم التالي)</span>" : ""}
              </div>

              <div class="team awayteam">
                <img src="${m.awayImg}" class="team_logo" alt="${m.away}">
                <span class="the_team" title="${m.away}">${m.away}</span>
              </div>
            </div>

            ${bottomHTML}

            <div class="action-btns" style="display: ${showBtns ? 'flex' : 'none'};">
              <button onclick="editMatch('${m.id}')" style="background:#f39c12; color:#fff;">✏️ تعديل</button>
              <button onclick="deleteMatch('${m.id}')" style="background:#e74c3c; color:#fff;">🗑️ حذف</button>
            </div>
          `;
          section.appendChild(card);
        });

        container.appendChild(section);
      });
    }

    // === تحميل الجدول كصورة Full HD بالهيدر والثيم والأسماء كاملة ===
    document.getElementById('downloadTable').addEventListener('click', async () => {
      const actionBtns = exportArea.querySelectorAll('.action-btns');
      actionBtns.forEach(btn => btn.style.display = 'none');

      // تفعيل وضع التصدير لعرض الأسماء كاملة وتوسيع الكرت
      exportArea.classList.add('export-mode');

      try {
        await document.fonts.ready;

        // جلب لون خلفية الثيم الحالي ديناميكياً
        const computedBg = window.getComputedStyle(exportArea).backgroundColor || '#141414';

        const dataUrl = await htmlToImage.toPng(exportArea, {
          pixelRatio: 3, // دقة 4K حادة جداً
          backgroundColor: computedBg
        });

        const link = document.createElement('a');
        link.download = `جدول_مباريات_${currentDate.toISOString().slice(0, 10)}.png`;
        link.href = dataUrl;
        link.click();
      } catch (error) {
        console.error('Error exporting image:', error);
        alert('حدث خطأ أثناء تصدير الصورة.');
      } finally {
        exportArea.classList.remove('export-mode');
        if (showBtns) {
          actionBtns.forEach(btn => btn.style.display = 'flex');
        }
      }
    });

    init();

    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(() => splash.style.display = 'none', 600);
    }, 1200);

  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
  </script>
</body>
</html>
